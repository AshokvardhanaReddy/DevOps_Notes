apiVersion: batch/v1
kind: Job
metadata:
  name: <string>
  namespace: <string>
  labels:
    app: batch-job
    environment: production
  annotations:
    description: batch job
    owner: ashok

  creationTimestamp: <string>
  deletionGracePeriodSeconds: <integer>
  deletionTimestamp: <string>
  finalizers:
    - <string>
  generateName: <string>
  generation: <integer>
  managedFields:
    - apiVersion: <string>
      fieldsType: <string>
      fieldsV1: <FieldsV1>
      manager: <string>
      operation: <string>
      subresource: <string>
      time: <string>
  ownerReferences:
    - apiVersion: <string> # Required
      blockOwnerDeletion: <boolean>
      controller: <boolean>
      kind: <string> # Required
      name: <string> # Required
      uid: <string> # Required
  resourceVersion: <string>
  selfLink: <string>
  uid: <string>

spec:
  completions: <integer>
  parallelism: <integer>
  backoffLimit: <integer>
  activeDeadlineSeconds: <integer>
  ttlSecondsAfterFinished: <integer>
  completionMode: Indexed, NonIndexed    # <string>

  selector:
    matchExpressions:
      - key: <string> # Required
        operator: <string> # Required
        values:
          - <string>
    matchLabels:
      app: batch-job
  

  backoffLimitPerIndex: <integer>
 

  managedBy: <string>
  manualSelector: <boolean>
  maxFailedIndexes: <integer>

  podFailurePolicy:
    rules:
      - action:  Count, FailIndex, FailJob, Ignore   # Required - <string>
        onExitCodes:
          containerName: <string>
          operator: <string> # Required
          # Enum: In, NotIn
          values:
            - <integer>
        onPodConditions:
          - status: <string>
            type: <string> # Required
  podReplacementPolicy: <string>
  # Enum: Failed, TerminatingOrFailed
  successPolicy:
    rules:
      - succeededCount: <integer>
        succeededIndexes: <string>
  suspend: <boolean>
  template: # Required
    metadata:
      name: <string>
      namespace: <string>
      labels:
        app: batch-job
      annotations:
        description: job pod template
      creationTimestamp: <string>
      deletionGracePeriodSeconds: <integer>
      deletionTimestamp: <string>
      finalizers:
        - <string>
      generateName: <string>
      generation: <integer>
      managedFields:
        - apiVersion: <string>
          fieldsType: <string>
          fieldsV1: <FieldsV1>
          manager: <string>
          operation: <string>
          subresource: <string>
          time: <string>
      ownerReferences:
        - apiVersion: <string> # Required
          blockOwnerDeletion: <boolean>
          controller: <boolean>
          kind: <string> # Required
          name: <string> # Required
          uid: <string> # Required
      resourceVersion: <string>
      selfLink: <string>
      uid: <string>
    spec:
      activeDeadlineSeconds: <integer>
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: <string> # Required
                    operator: <string> # Required
                    # Enum: DoesNotExist, Exists, Gt, In, Lt
                    values:
                      - <string>
                matchFields:
                  - key: <string> # Required
                    operator: <string> # Required
                    # Enum: DoesNotExist, Exists, Gt, In, Lt
                    values:
                      - <string>
              weight: <integer> # Required
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: <string> # Required
                    operator: <string> # Required
                    # Enum: DoesNotExist, Exists, Gt, In, Lt
                    values:
                      - <string>
                matchFields:
                  - key: <string> # Required
                    operator: <string> # Required
                    # Enum: DoesNotExist, Exists, Gt, In, Lt
                    values:
                      - <string>
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: <string> # Required
                      operator: <string> # Required
                      values:
                        - <string>
                  matchLabels:
                    app: batch-job
                matchLabelKeys:
                  - <string>
                mismatchLabelKeys:
                  - <string>
                namespaceSelector:
                  matchExpressions:
                    - key: <string> # Required
                      operator: <string> # Required
                      values:
                        - <string>
                  matchLabels:
                    app: batch-job
                namespaces:
                  - <string>
                topologyKey: <string> # Required
              weight: <integer> # Required
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: <string> # Required
                    operator: <string> # Required
                    values:
                      - <string>
                matchLabels:
                  app: batch-job
              matchLabelKeys:
                - <string>
              mismatchLabelKeys:
                - <string>
              namespaceSelector:
                matchExpressions:
                  - key: <string> # Required
                    operator: <string> # Required
                    values:
                      - <string>
                matchLabels:
                  app: batch-job
              namespaces:
                - <string>
              topologyKey: <string> # Required
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: <string> # Required
                      operator: <string> # Required
                      values:
                        - <string>
                  matchLabels:
                    app: batch-job
                matchLabelKeys:
                  - <string>
                mismatchLabelKeys:
                  - <string>
                namespaceSelector:
                  matchExpressions:
                    - key: <string> # Required
                      operator: <string> # Required
                      values:
                        - <string>
                  matchLabels:
                    app: batch-job
                namespaces:
                  - <string>
                topologyKey: <string> # Required
              weight: <integer> # Required
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: <string> # Required
                    operator: <string> # Required
                    values:
                      - <string>
                matchLabels:
                  app: batch-job
              matchLabelKeys:
                - <string>
              mismatchLabelKeys:
                - <string>
              namespaceSelector:
                matchExpressions:
                  - key: <string> # Required
                    operator: <string> # Required
                    values:
                      - <string>
                matchLabels:
                  app: batch-job
              namespaces:
                - <string>
              topologyKey: <string> # Required
      automountServiceAccountToken: <boolean>
      containers: # Required
        - name: <string> # Required
          image: <string>
          imagePullPolicy: <string>
          # Enum: Always, IfNotPresent, Never
          command:
            - <string>
          args:
            - <string>
          env:
            - name: <string> # Required
              value: <string>
              valueFrom:
                configMapKeyRef:
                  key: <string> # Required
                  name: <string>
                  optional: <boolean>
                fieldRef:
                  apiVersion: <string>
                  fieldPath: <string> # Required
                fileKeyRef:
                  key: <string> # Required
                  optional: <boolean>
                  path: <string> # Required
                  volumeName: <string> # Required
                resourceFieldRef:
                  containerName: <string>
                  divisor: <Quantity>
                  resource: <string> # Required
                secretKeyRef:
                  key: <string> # Required
                  name: <string>
                  optional: <boolean>
          envFrom:
            - configMapRef:
                name: <string>
                optional: <boolean>
              prefix: <string>
              secretRef:
                name: <string>
                optional: <boolean>
          lifecycle:
            postStart:
              exec:
                command:
                  - <string>
              httpGet:
                host: <string>
                httpHeaders:
                  - name: <string> # Required
                    value: <string> # Required
                path: <string>
                port: <IntOrString> # Required
                scheme: <string>
                # Enum: HTTP, HTTPS
              sleep:
                seconds: <integer> # Required
              tcpSocket:
                host: <string>
                port: <IntOrString> # Required
            preStop:
              exec:
                command:
                  - <string>
              httpGet:
                host: <string>
                httpHeaders:
                  - name: <string> # Required
                    value: <string> # Required
                path: <string>
                port: <IntOrString> # Required
                scheme: <string>
                # Enum: HTTP, HTTPS
              sleep:
                seconds: <integer> # Required
              tcpSocket:
                host: <string>
                port: <IntOrString> # Required
          stopSignal: <string>
          # Enum: SIGABRT, SIGALRM, SIGBUS, SIGCHLD, ....
          livenessProbe:
            exec:
              command:
                - <string>
            failureThreshold: <integer>
            grpc:
              port: <integer> # Required
              service: <string>
            httpGet:
              host: <string>
              httpHeaders:
                - name: <string> # Required
                  value: <string> # Required
              path: <string>
              port: <IntOrString> # Required
              scheme: <string>
              # Enum: HTTP, HTTPS
            initialDelaySeconds: <integer>
            periodSeconds: <integer>
            successThreshold: <integer>
            tcpSocket:
              host: <string>
              port: <IntOrString> # Required
            terminationGracePeriodSeconds: <integer>
            timeoutSeconds: <integer>
          ports:
            - containerPort: <integer> # Required
              hostIP: <string>
              hostPort: <integer>
              name: <string>
              protocol: <string>
              # Enum: SCTP, TCP, UDP
          readinessProbe:
            exec:
              command:
                - <string>
            failureThreshold: <integer>
            grpc:
              port: <integer> # Required
              service: <string>
            httpGet:
              host: <string>
              httpHeaders:
                - name: <string> # Required
                  value: <string> # Required
              path: <string>
              port: <IntOrString> # Required
              scheme: <string>
              # Enum: HTTP, HTTPS
            initialDelaySeconds: <integer>
            periodSeconds: <integer>
            successThreshold: <integer>
            tcpSocket:
              host: <string>
              port: <IntOrString> # Required
            terminationGracePeriodSeconds: <integer>
            timeoutSeconds: <integer>
          resizePolicy:
            - resourceName: <string> # Required
              restartPolicy: <string> # Required
          resources:
            claims:
              - name: <string> # Required
                request: <string>
            limits:
              cpu: <Quantity>
              memory: <Quantity>
            requests:
              cpu: <Quantity>
              memory: <Quantity>
          restartPolicy: <string>
          restartPolicyRules:
            - action: <string> # Required
              exitCodes:
                operator: <string> # Required
                values:
                  - <integer>
          securityContext:
            allowPrivilegeEscalation: <boolean>
            appArmorProfile:
              localhostProfile: <string>
              type: <string> # Required
              # Enum: Localhost, RuntimeDefault, Unconfined
            capabilities:
              add:
                - <string>
              drop:
                - <string>
            privileged: <boolean>
            procMount: <string>
            # Enum: Default, Unmasked
            readOnlyRootFilesystem: <boolean>
            runAsGroup: <integer>
            runAsNonRoot: <boolean>
            runAsUser: <integer>
            seLinuxOptions:
              level: <string>
              role: <string>
              type: <string>
              user: <string>
            seccompProfile:
              localhostProfile: <string>
              type: <string> # Required
              # Enum: Localhost, RuntimeDefault, Unconfined
            windowsOptions:
              gmsaCredentialSpec: <string>
              gmsaCredentialSpecName: <string>
              hostProcess: <boolean>
              runAsUserName: <string>
          startupProbe:
            exec:
              command:
                - <string>
            failureThreshold: <integer>
            grpc:
              port: <integer> # Required
              service: <string>
            httpGet:
              host: <string>
              httpHeaders:
                - name: <string> # Required
                  value: <string> # Required
              path: <string>
              port: <IntOrString> # Required
              scheme: <string>
              # Enum: HTTP, HTTPS
            initialDelaySeconds: <integer>
            periodSeconds: <integer>
            successThreshold: <integer>
            tcpSocket:
              host: <string>
              port: <IntOrString> # Required
            terminationGracePeriodSeconds: <integer>
            timeoutSeconds: <integer>
          stdin: <boolean>
          stdinOnce: <boolean>
          terminationMessagePath: <string>
          terminationMessagePolicy: <string>
          # Enum: FallbackToLogsOnError, File
          tty: <boolean>
          volumeDevices:
            - devicePath: <string> # Required
              name: <string> # Required
          volumeMounts:
            - mountPath: <string> # Required
              mountPropagation: <string>
              # Enum: Bidirectional, HostToContainer, None
              name: <string> # Required
              readOnly: <boolean>
              recursiveReadOnly: <string>
              subPath: <string>
              subPathExpr: <string>
          workingDir: <string>
      dnsConfig:
        nameservers:
          - <string>
        options:
          - name: <string>
            value: <string>
        searches:
          - <string>
      dnsPolicy: <string>
      # Enum: ClusterFirst, ClusterFirstWithHostNet, Default, None
      enableServiceLinks: <boolean>
      ephemeralContainers:
        - name: <string> # Required
          image: <string>
          imagePullPolicy: <string>
          # Enum: Always, IfNotPresent, Never
          command:
            - <string>
          args:
            - <string>
          env:
            - name: <string> # Required
              value: <string>
          envFrom:
            - configMapRef:
                name: <string>
                optional: <boolean>
              prefix: <string>
              secretRef:
                name: <string>
                optional: <boolean>
          targetContainerName: <string>
      hostAliases:
        - ip: <string> # Required
          hostnames:
            - <string>
      hostIPC: <boolean>
      hostNetwork: <boolean>
      hostPID: <boolean>
      hostUsers: <boolean>
      hostname: <string>
      hostnameOverride: <string>
      imagePullSecrets:
        - name: <string>
      initContainers:
        - name: <string> # Required
          image: <string>
          imagePullPolicy: <string>
          # Enum: Always, IfNotPresent, Never
          command:
            - <string>
          args:
            - <string>
          env:
            - name: <string> # Required
              value: <string>
          envFrom:
            - configMapRef:
                name: <string>
                optional: <boolean>
              prefix: <string>
              secretRef:
                name: <string>
                optional: <boolean>
          resources:
            claims:
              - name: <string> # Required
                request: <string>
            limits:
              cpu: <Quantity>
              memory: <Quantity>
            requests:
              cpu: <Quantity>
              memory: <Quantity>
          volumeMounts:
            - mountPath: <string> # Required
              name: <string> # Required
              readOnly: <boolean>
              subPath: <string>
              subPathExpr: <string>
      nodeName: <string>
      nodeSelector:
        disktype: ssd
        environment: production
      os:
        name: <string> # Required
      overhead:
        cpu: <Quantity>
        memory: <Quantity>
      preemptionPolicy: <string>
      # Enum: Never, PreemptLowerPriority
      priority: <integer>
      priorityClassName: <string>
      readinessGates:
        - conditionType: <string> # Required
      resourceClaims:
        - name: <string> # Required
          resourceClaimName: <string>
          resourceClaimTemplateName: <string>
      resources:
        claims:
          - name: <string> # Required
            request: <string>
        limits:
          cpu: <Quantity>
          memory: <Quantity>
        requests:
          cpu: <Quantity>
          memory: <Quantity>
      restartPolicy: Always, Never, OnFailure
      runtimeClassName: <string>
      schedulerName: <string>
      schedulingGates:
        - name: <string> # Required
      securityContext:
        appArmorProfile:
          localhostProfile: <string>
          type: <string> # Required
          # Enum: Localhost, RuntimeDefault, Unconfined
        fsGroup: <integer>
        fsGroupChangePolicy: <string>
        # Enum: Always, OnRootMismatch
        runAsGroup: <integer>
        runAsNonRoot: <boolean>
        runAsUser: <integer>
        seLinuxChangePolicy: <string>
        seLinuxOptions:
          level: <string>
          role: <string>
          type: <string>
          user: <string>
        seccompProfile:
          localhostProfile: <string>
          type: <string> # Required
          # Enum: Localhost, RuntimeDefault, Unconfined
        supplementalGroups:
          - <integer>
        supplementalGroupsPolicy: <string>
        # Enum: Merge, Strict
        sysctls:
          - name: <string> # Required
            value: <string> # Required
        windowsOptions:
          gmsaCredentialSpec: <string>
          gmsaCredentialSpecName: <string>
          hostProcess: <boolean>
          runAsUserName: <string>
      serviceAccount: <string>
      serviceAccountName: <string>
      setHostnameAsFQDN: <boolean>
      shareProcessNamespace: <boolean>
      subdomain: <string>
      terminationGracePeriodSeconds: <integer>
      tolerations:
        - effect: <string>
          # Enum: NoExecute, NoSchedule, PreferNoSchedule
          key: <string>
          operator: <string>
          # Enum: Equal, Exists, Gt, Lt
          tolerationSeconds: <integer>
          value: <string>
      topologySpreadConstraints:
        - labelSelector:
            matchExpressions:
              - key: <string> # Required
                operator: <string> # Required
                values:
                  - <string>
            matchLabels:
              app: batch-job
          matchLabelKeys:
            - <string>
          maxSkew: <integer> # Required
          minDomains: <integer>
          nodeAffinityPolicy: <string>
          # Enum: Honor, Ignore
          nodeTaintsPolicy: <string>
          # Enum: Honor, Ignore
          topologyKey: <string> # Required
          whenUnsatisfiable: <string> # Required
          # Enum: DoNotSchedule, ScheduleAnyway
      volumes:
        - name: <string> # Required
          configMap:
            defaultMode: <integer>
            items:
              - key: <string> # Required
                mode: <integer>
                path: <string> # Required
            name: <string>
            optional: <boolean>
          emptyDir:
            medium: <string>
            sizeLimit: <Quantity>
          secret:
            defaultMode: <integer>
            items:
              - key: <string> # Required
                mode: <integer>
                path: <string> # Required
            optional: <boolean>
            secretName: <string>
          persistentVolumeClaim:
            claimName: <string> # Required
            readOnly: <boolean>
          hostPath:
            path: <string> # Required
            type: <string>
            # Enum: "", BlockDevice, CharDevice, Directory, ....
          projected:
            defaultMode: <integer>
            sources:
              - configMap:
                  items:
                    - key: <string> # Required
                      mode: <integer>
                      path: <string> # Required
                  name: <string>
                  optional: <boolean>
                secret:
                  items:
                    - key: <string> # Required
                      mode: <integer>
                      path: <string> # Required
                  name: <string>
                  optional: <boolean>
                serviceAccountToken:
                  audience: <string>
                  expirationSeconds: <integer>
                  path: <string> # Required
      workloadRef:
        name: <string> # Required
        podGroup: <string> # Required
        podGroupReplicaKey: <string>



status:
  active: <integer>
  completedIndexes: <string>
  completionTime: <string>
  conditions:
    - lastProbeTime: <string>
      lastTransitionTime: <string>
      message: <string>
      reason: <string>
      status: <string> # Required
      type: <string> # Required
  failed: <integer>
  failedIndexes: <string>
  ready: <integer>
  startTime: <string>
  succeeded: <integer>
  terminating: <integer>
  uncountedTerminatedPods:
    failed:
      - <string>
    succeeded:
      - <string>