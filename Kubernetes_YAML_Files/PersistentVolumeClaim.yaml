apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: <string>
  namespace: <string>
  labels:
    app: mysql
    environment: production
  annotations:
    description: persistent volume claim
    owner: ashok

  creationTimestamp: <string>
  deletionGracePeriodSeconds: <integer>
  deletionTimestamp: <string>
  finalizers:
    - <string>
  generateName: <string>
  generation: <integer>
  managedFields:
    - apiVersion: <string>
      fieldsType: <string>
      fieldsV1: <FieldsV1>
      manager: <string>
      operation: <string>
      subresource: <string>
      time: <string>
  ownerReferences:
    - apiVersion: <string> # Required
      blockOwnerDeletion: <boolean>
      controller: <boolean>
      kind: <string> # Required
      name: <string> # Required
      uid: <string> # Required
  resourceVersion: <string>
  selfLink: <string>
  uid: <string>
spec:
  selector:                         # Select PVs based on labels
    matchExpressions:
      - key: <string> # Required
        operator: <string> # Required
        values:
          - <string>
    matchLabels:
      app: mysql
      environment: production
  accessModes:
    - <string>
  resources:
    requests:
      storage: <Quantity>
      cpu: <Quantity>
      memory: <Quantity>
    limits:
      cpu: <Quantity>
      memory: <Quantity>
  storageClassName: <string>
  volumeMode: Block, Filesystem
  volumeName: <string>                    # Explicitly bind PVC to a PV
  volumeAttributesClassName: <string>
  dataSource:                               # dataSource is for creating a PVC from another supported data source, such as an existing PVC. It does not select a PV. Create/restore a PVC from a data source
    name: <string> # Required
    kind: <string> # Required
    apiGroup: <string>   
  dataSourceRef:
    name: <string> # Required
    namespace: <string>
    kind: <string> # Required
    apiGroup: <string>

status:
  accessModes:
    - <string>
  allocatedResourceStatuses:
    resource: status
  allocatedResources:
    storage: <Quantity>
    cpu: <Quantity>
    memory: <Quantity>
  capacity:
    storage: <Quantity>
  conditions:
    - lastProbeTime: <string>
      lastTransitionTime: <string>
      message: <string>
      reason: <string>
      status: <string> # Required
      type: <string> # Required
  currentVolumeAttributesClassName: <string>
  modifyVolumeStatus:
    status: <string> # Required
    # Enum: InProgress, Infeasible, Pending
    targetVolumeAttributesClassName: <string>
  phase: <string>
  # Enum: Bound, Lost, Pending