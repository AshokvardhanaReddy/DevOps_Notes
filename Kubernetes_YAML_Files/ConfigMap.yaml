apiVersion: v1
kind: ConfigMap
metadata:
  name: <string>
  namespace: <string>
  labels:
    app: nginx
    environment: development
  annotations:
    description: application configuration
    owner: ashok

  creationTimestamp: <string>
  deletionGracePeriodSeconds: <integer>
  deletionTimestamp: <string>
  finalizers:
    - <string>
  generateName: <string>
  generation: <integer>
  managedFields:
    - apiVersion: <string>
      fieldsType: <string>
      fieldsV1: <FieldsV1>
      manager: <string>
      operation: <string>
      subresource: <string>
      time: <string>
  ownerReferences:
    - apiVersion: <string>       # Required
      blockOwnerDeletion: <boolean>
      controller: <boolean>
      kind: <string>             # Required
      name: <string>             # Required
      uid: <string>              # Required
  resourceVersion: <string>
  selfLink: <string>
  uid: <string>

immutable: <boolean>
data:
  <key>: <value>
binaryData:
  <key>: <value>