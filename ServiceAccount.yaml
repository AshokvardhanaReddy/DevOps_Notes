apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: <boolean>
imagePullSecrets:
  - name: <string>
metadata:
  name: <string>
  namespace: <string>
  annotations: <map[string]string>
  creationTimestamp: <string>
  deletionGracePeriodSeconds: <integer>
  deletionTimestamp: <string>
  finalizers:
    - <string>
  generateName: <string>
  generation: <integer>
  labels: <map[string]string>
  managedFields:
    - apiVersion: <string>
      fieldsType: <string>
      fieldsV1: <FieldsV1>
      manager: <string>
      operation: <string>
      subresource: <string>
      time: <string>
  ownerReferences:
    - apiVersion: <string> # Required
      blockOwnerDeletion: <boolean>
      controller: <boolean>
      kind: <string> # Required
      name: <string> # Required
      uid: <string> # Required
  resourceVersion: <string>
  selfLink: <string>
  uid: <string>
secrets:
  - apiVersion: <string>
    fieldPath: <string>
    kind: <string>
    name: <string>
    namespace: <string>
    resourceVersion: <string>
    uid: <string>